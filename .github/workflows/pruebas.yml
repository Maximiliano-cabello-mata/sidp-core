name: Arquitectura SIDP
on: [push, pull_request]
jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ejecutable:
    # Ejecutable genérico, sin paquete de instalación: los secretos nunca pasan por CI.
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python despliegue/compilar.py
      - run: dist/sidp.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: sidp-windows
          path: dist/sidp.exe
