name: Arquitectura SIDP
on: [push, pull_request]
jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.12 es la versión de referencia; 3.14 es la que usan los equipos de desarrollo.
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  base_cerebro:
    # La base de datos del cerebro (PostgreSQL en la PC 4): el padrón y la comparación contra lo leído.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sidp
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: sidp_cerebro
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt "pypdf>=5.1" "pg8000>=1.31"
      - run: python -m pytest -q pruebas/test_base_cerebro.py
        env:
          SIDP_PRUEBA_BASE: postgresql://sidp:prueba@127.0.0.1:5432/sidp_cerebro
          SIDP_SIN_PADDLE: '1'

  ejecutable:
    # Ejecutables sin paquete de instalación: los secretos nunca pasan por CI.
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      # Los scripts de la PC 4 se corren a mano allá: aquí solo se revisa que PowerShell los entienda.
      - shell: pwsh
        run: |
          $mal = 0
          foreach ($archivo in Get-ChildItem cerebro/pc4 -Filter *.ps1) {
            $errores = $null
            [System.Management.Automation.Language.Parser]::ParseFile($archivo.FullName, [ref]$null, [ref]$errores) | Out-Null
            foreach ($e in $errores) { Write-Host "$($archivo.Name): $($e.Message) (línea $($e.Extent.StartLineNumber))"; $mal++ }
          }
          if ($mal) { exit 1 }
      # Dos ejecutables (ADR-029): uno para el servidor y otro para las demás computadoras.
      - run: python despliegue/compilar.py --tipo servidor
      - run: python despliegue/compilar.py --tipo equipo
      # Entorno de pruebas de validación: el .exe del administrador revisa el ejemplo inventado
      # sin cerebro y falla si algún falso pasa como listo.
      - run: python -m pip install "pypdf>=5.1"
      - run: python despliegue/compilar.py --tipo validador
      - run: dist/SIDP-Validador.exe validacion/ejemplo --hoy 2026-10-14 --revisar --sin-modelo
      - run: dist/SIDP-Servidor.exe --help
      - run: dist/SIDP-Equipo.exe --help
      # Tres equipos simulados con los .exe reales: alta, descubrimiento, TLS, ida y vuelta, reparto
      # y que un segundo servidor con la misma clave se niegue a crearse.
      - run: python despliegue/ensayo_dos_equipos.py dist/SIDP-Servidor.exe --estacion dist/SIDP-Equipo.exe
      - run: Copy-Item docs/guias/PRUEBA_DOS_EQUIPOS.md, docs/guias/ENTORNO_PRUEBAS.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sidp-windows
          path: |
            dist/SIDP-Servidor.exe
            dist/SIDP-Equipo.exe
            dist/SIDP-Validador.exe
            dist/PRUEBA_DOS_EQUIPOS.md
            dist/ENTORNO_PRUEBAS.md
