name: Arquitectura SIDP
on: [push, pull_request]
jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.12 es la versión de referencia; 3.14 es la que usan los equipos de desarrollo.
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  ejecutable:
    # Ejecutables sin paquete de instalación: los secretos nunca pasan por CI.
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      # Dos ejecutables (ADR-029): uno para el servidor y otro para las demás computadoras.
      - run: python despliegue/compilar.py --tipo servidor
      - run: python despliegue/compilar.py --tipo equipo
      - run: dist/SIDP-Servidor.exe --help
      - run: dist/SIDP-Equipo.exe --help
      # Tres equipos simulados con los .exe reales: alta, descubrimiento, TLS, ida y vuelta, reparto
      # y que un segundo servidor con la misma clave se niegue a crearse.
      - run: python despliegue/ensayo_dos_equipos.py dist/SIDP-Servidor.exe --estacion dist/SIDP-Equipo.exe
      - run: Copy-Item docs/PRUEBA_DOS_EQUIPOS.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sidp-windows
          path: |
            dist/SIDP-Servidor.exe
            dist/SIDP-Equipo.exe
            dist/PRUEBA_DOS_EQUIPOS.md
