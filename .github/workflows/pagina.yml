name: Página de demostración
# Demostración pública de la validación (GitHub Pages): corre en el navegador con expedientes inventados.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pagina
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m herramientas.armar_pagina _pagina
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pagina
      - id: despliegue
        uses: actions/deploy-pages@v4
